<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }

    nav{
        display: flex;
       align-items: center;
        background-color: black;
        height: 50px;
       
    }

    /*
        Colocando o Display flex colocando todos na mesma linha
    */
    nav ul{
        display: flex;
        list-style: none;
        margin-left: 10px;
    }


    /*
        Pegando o link que está dentro de nav

        Podemos tirar sua decoração(A linha logo abaixo)

        E colocar seu cursor quando passamos o mouse em cima
    */
    nav a {
        color: #fff ;
        text-decoration: none;
        cursor: pointer;
        font-family: Arial, Helvetica, sans-serif;
        background-color: red;
        padding: 10px 20px;
        display: block;
        text-transform: uppercase;
    }

    /*
        Sempre quando passamos o mouse por cima podemos colocar um estilo 
    */
    nav a:hover{
        background-color: bisque;
    }
</style>
<body>
    <nav>
        <ul>
            <li><a href="#">Home </a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
   <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <ol type="">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ol>

    <!--Descrição e Descrição do item-->
    <!--Utilizando essas siglas podemos fazer isso-->
    <dl>
        <dt>cafe</dt>
        <dd>Quente e frio ?</dd>
    </dl>
</body>
</html>
